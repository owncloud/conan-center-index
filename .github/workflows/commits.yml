name: Commits

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  semantic-git-messages:
    name: Commits
    uses: owncloud/reusable-workflows/.github/workflows/semantic-git-message.yml@main

  dco:
    name: DCO
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Require a Signed-off-by from the author or committer on every commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          PR_COMMITS: ${{ github.event.pull_request.commits }}
        run: |
          # The commits endpoint stops at 250 even with --paginate.
          if [ "$PR_COMMITS" -gt 250 ]; then
            echo "::error::$PR_COMMITS commits is more than the 250 this check can list; split or squash the PR."
            exit 1
          fi
          # shellcheck disable=SC2016 # $ids is a jq variable, not a shell one
          missing=$(gh api --paginate "repos/$REPO/pulls/$PR/commits" --jq '
            .[]
            | ([.commit.author.email, .commit.committer.email] | map(ascii_downcase)) as $ids
            | select(
                [.commit.message | scan("(?mi)^signed-off-by:\\s*[^<]*<([^>]+)>") | .[0] | ascii_downcase]
                | any(.[]; . as $e | any($ids[]; . == $e)) | not
              )
            | "\(.sha[0:12]) \(.commit.author.email) \(.commit.message | split("\n")[0])"
          ')
          if [ -n "$missing" ]; then
            echo "::error::Commits without a Signed-off-by trailer from their author or committer (use git commit -s):"
            echo "$missing"
            exit 1
          fi
          echo "All commits are signed off."
