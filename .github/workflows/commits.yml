name: Commits

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  semantic-git-messages:
    name: Commits
    uses: owncloud/reusable-workflows/.github/workflows/semantic-git-message.yml@main

  dco:
    name: DCO
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Require a Signed-off-by matching the author on every commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # shellcheck disable=SC2016 # $email is a jq variable, not a shell one
          missing=$(gh api --paginate "repos/$REPO/pulls/$PR/commits" --jq '
            .[]
            | (.commit.author.email | ascii_downcase) as $email
            | select(
                [.commit.message | scan("(?m)^Signed-off-by: [^<]*<([^>]+)>") | .[0] | ascii_downcase]
                | any(.[]; . == $email) | not
              )
            | "\(.sha[0:12]) \(.commit.author.email) \(.commit.message | split("\n")[0])"
          ')
          if [ -n "$missing" ]; then
            echo "::error::Commits without a Signed-off-by trailer matching their author (use git commit -s):"
            echo "$missing"
            exit 1
          fi
          echo "All commits are signed off."
