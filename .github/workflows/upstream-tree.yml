name: Upstream tree

on:
  push:
    branches:
      - master
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

# Grouped per event, as in zizmor.yml; a newer push to a PR cancels the older run.
concurrency:
  group: upstream-tree-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    # Everything under recipes/ docs/ assets/ except the ownCloud recipes is
    # upstream's. This fails on any other change to it, including on the sync
    # branch: such a change belongs upstream or in .sync/patches/.
    name: Upstream tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compare with upstream
        run: scripts/sync-upstream.sh --verify
