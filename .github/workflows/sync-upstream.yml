name: Sync upstream

on:
  schedule:
    # Weekly, so that each sync stays small enough to review.
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  BRANCH: chore/sync-upstream
  TITLE: 'chore: sync recipes with upstream conan-center-index'
  UPSTREAM_URL: https://github.com/conan-io/conan-center-index.git
  # The owncloud-conan-bot GitHub App (contents and pull requests write). Its slug
  # and client ID are public; only its private key is a secret.
  APP_SLUG: owncloud-conan-bot
  APP_CLIENT_ID: Iv23liMkHVRgV0tcaYoC

# Only git and our own scripts run here, never upstream recipe code, and the
# app token exists only in the last job.
jobs:
  sync:
    name: Check for upstream changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      # changed, current, or held while someone else has commits on the branch.
      result: ${{ steps.check.outputs.result }}
      # The pull-request job syncs the same upstream and master commits, and refuses
      # to push if master or the branch head (the lease) has moved since.
      upstream: ${{ steps.check.outputs.upstream }}
      master: ${{ steps.check.outputs.master }}
      lease: ${{ steps.check.outputs.lease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          sparse-checkout: .sync
          persist-credentials: false

      - name: Check
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          master="$(git rev-parse HEAD)"
          echo "master=$master" >> "$GITHUB_OUTPUT"
          upstream="$(git ls-remote "$UPSTREAM_URL" refs/heads/master | cut -f1)"
          [ -n "$upstream" ] || { echo "::error::cannot read upstream master"; exit 1; }
          echo "upstream=$upstream" >> "$GITHUB_OUTPUT"
          if [ "$upstream" = "$(tr -d '[:space:]' < .sync/upstream-commit)" ]; then
            echo "result=current" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The branch head before the check below; the last job refuses to push if
          # it has moved since.
          lease="$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)"
          echo "lease=$lease" >> "$GITHUB_OUTPUT"
          if [ -n "$lease" ]; then
            # A commit on the branch that the app did not both author and commit (an
            # amend or rebase keeps the author) holds the sync, whether or not a PR is
            # open; the branch is deleted on merge. A failed call fails the job rather
            # than reading as "no one else".
            others="$(gh api "repos/$GITHUB_REPOSITORY/compare/$master...$lease" \
              | jq -r --arg bot "${APP_SLUG}[bot]" \
                '.commits[] | select(.author.login != $bot or .committer.login != $bot) | .sha')"
            if [ -n "$others" ]; then
              echo "::warning::$BRANCH has commits by someone else; leaving it alone until it is merged or deleted"
              echo "result=held" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "result=changed" >> "$GITHUB_OUTPUT"

  pull-request:
    name: Open or update the pull request
    needs: sync
    # The implicit success() requires every job in needs to succeed. Add !cancelled()
    # only together with a result check for each, or a failed job would let this run.
    if: needs.sync.outputs.result == 'changed'
    runs-on: ubuntu-latest
    # Holds the app's secrets; restrict its deployment branches to master.
    environment: sync-upstream
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.sync.outputs.master }}
          persist-credentials: false

      - name: Sync
        id: sync
        env:
          UPSTREAM: ${{ needs.sync.outputs.upstream }}
        run: |
          rc=0
          scripts/sync-upstream.sh --report "$RUNNER_TEMP/report.md" "$UPSTREAM" || rc=$?
          case "$rc" in
            0) echo "result=clean" >> "$GITHUB_OUTPUT" ;;
            11) echo "result=attention" >> "$GITHUB_OUTPUT" ;;
            *) exit "$rc" ;;
          esac

      - name: Write the pull request body
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            head -c 50000 "$RUNNER_TEMP/report.md"
            if [ "$(wc -c < "$RUNNER_TEMP/report.md")" -gt 50000 ]; then
              printf '\n\n**The report was cut short here; the full one is in the [run summary](%s).**\n' "$RUN_URL"
            fi
            echo
            echo "---"
            echo "Opened by the [Sync upstream]($RUN_URL) workflow, which replaces this branch every week while"
            echo "the pull request is open. A commit by anyone else stops that until it is merged, or the branch is deleted."
          } > "$RUNNER_TEMP/body.md"
          cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"

      # An app token rather than GITHUB_TOKEN: a pull request pushed with
      # GITHUB_TOKEN does not trigger workflows, so the required checks would
      # never run on it.
      - name: Create app token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ env.APP_CLIENT_ID }}
          private-key: ${{ secrets.CONAN_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Check the branch
        id: check
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          TOKEN_APP_SLUG: ${{ steps.app.outputs.app-slug }}
          LEASE: ${{ needs.sync.outputs.lease }}
          MASTER: ${{ needs.sync.outputs.master }}
        run: |
          # The sync job told the app's commits from others' by this name.
          [ "$TOKEN_APP_SLUG" = "$APP_SLUG" ] \
            || { echo "::error::the token is for $TOKEN_APP_SLUG, not $APP_SLUG"; exit 1; }
          # The action below force-pushes without a lease, and puts the sync onto
          # master as it is then, so make sure neither has moved since the sync job.
          head="$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)"
          [ "$head" = "$LEASE" ] \
            || { echo "::error::$BRANCH moved since the check (${LEASE:-none} -> ${head:-none}); run again"; exit 1; }
          [ "$(git ls-remote origin refs/heads/master | cut -f1)" = "$MASTER" ] \
            || { echo "::error::master moved since the sync job; run again"; exit 1; }
          bot="${APP_SLUG}[bot]"
          # The noreply address links the commit to the app; a wrong one would make
          # the next run take the app's own commit for someone else's.
          id="$(gh api "/users/$bot" --jq .id)"
          case "$id" in '' | *[!0-9]*) echo "::error::no user id for $bot"; exit 1 ;; esac
          echo "identity=$bot <$id+$bot@users.noreply.github.com>" >> "$GITHUB_OUTPUT"

      # The organisation's way to open bot pull requests (see owncloud/reusable-workflows).
      # It commits the whole worktree as the app, puts that commit onto master and
      # pushes it with git. Not sign-commits: that recreates the commit file by file
      # through the API, and a sync touches more files than GitHub's secondary rate
      # limit allows per hour. The branch has no signature rule, and the squash merge
      # onto master is signed by GitHub.
      - name: Open or update the pull request
        id: cpr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app.outputs.token }}
          branch: ${{ env.BRANCH }}
          base: master
          title: ${{ env.TITLE }}
          body-path: ${{ runner.temp }}/body.md
          commit-message: |
            ${{ env.TITLE }}

            Upstream: conan-io/conan-center-index@${{ needs.sync.outputs.upstream }}
          author: ${{ steps.check.outputs.identity }}
          committer: ${{ steps.check.outputs.identity }}
          signoff: true
          delete-branch: true
          # Applies on create only; the next step sets it on every later run.
          draft: ${{ steps.sync.outputs.result != 'clean' }}

      - name: Set the draft state
        # Also when the branch was already up to date (operation none), since the
        # draft state may still be wrong, e.g. after a manual change.
        if: steps.cpr.outputs.pull-request-number != '' && !contains(fromJSON('["created", "closed"]'), steps.cpr.outputs.pull-request-operation)
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PR: ${{ steps.cpr.outputs.pull-request-number }}
          RESULT: ${{ steps.sync.outputs.result }}
        run: |
          is_draft="$(gh pr view "$PR" --json isDraft --jq .isDraft)"
          if [ "$RESULT" = clean ] && [ "$is_draft" = true ]; then
            gh pr ready "$PR"
          elif [ "$RESULT" != clean ] && [ "$is_draft" = false ]; then
            gh pr ready "$PR" --undo
          fi
