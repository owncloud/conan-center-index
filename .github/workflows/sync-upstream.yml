name: Sync upstream

on:
  schedule:
    # Weekly, so that each sync stays small enough to review.
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  BRANCH: chore/sync-upstream
  TITLE: 'chore: sync recipes with upstream conan-center-index'
  CONAN_VERSION: '2.34.0'
  UPSTREAM_URL: https://github.com/conan-io/conan-center-index.git

# The sync itself runs only git and our own scripts. Resolving the graph runs
# upstream recipe code, so that job gets no secrets and hands back nothing but
# a report; the app token exists only in the last job, which runs no upstream
# code.
jobs:
  sync:
    name: Check for upstream changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      # changed, current, or held while someone else has commits on the branch.
      result: ${{ steps.check.outputs.result }}
      # The later jobs sync these same commits, not whatever master is by then.
      upstream: ${{ steps.check.outputs.upstream }}
      master: ${{ steps.check.outputs.master }}
      lease: ${{ steps.check.outputs.lease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          sparse-checkout: .sync
          persist-credentials: false

      - name: Check
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          SYNC_APP_SLUG: ${{ vars.SYNC_APP_SLUG }}
        run: |
          [ -n "$SYNC_APP_SLUG" ] || { echo "::error::set the repository variable SYNC_APP_SLUG"; exit 1; }
          master="$(git rev-parse HEAD)"
          echo "master=$master" >> "$GITHUB_OUTPUT"
          upstream="$(git ls-remote "$UPSTREAM_URL" refs/heads/master | cut -f1)"
          [ -n "$upstream" ] || { echo "::error::cannot read upstream master"; exit 1; }
          echo "upstream=$upstream" >> "$GITHUB_OUTPUT"
          if [ "$upstream" = "$(tr -d '[:space:]' < .sync/upstream-commit)" ]; then
            echo "result=current" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The branch head before the check below; the last job refuses to push if
          # it has moved since.
          lease="$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)"
          echo "lease=$lease" >> "$GITHUB_OUTPUT"
          if [ -n "$lease" ]; then
            # A commit on the branch that the app did not both author and commit (an
            # amend or rebase keeps the author) holds the sync, whether or not a PR is
            # open; the branch is deleted on merge. A failed call fails the job rather
            # than reading as "no one else".
            others="$(gh api "repos/$GITHUB_REPOSITORY/compare/$master...$lease" \
              | jq -r --arg bot "${SYNC_APP_SLUG}[bot]" \
                '.commits[] | select(.author.login != $bot or .committer.login != $bot) | .sha')"
            if [ -n "$others" ]; then
              echo "::warning::$BRANCH has commits by someone else; leaving it alone until it is merged or deleted"
              echo "result=held" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "result=changed" >> "$GITHUB_OUTPUT"

  graph:
    name: Resolve the dependency graph
    needs: sync
    if: needs.sync.outputs.result == 'changed'
    runs-on: ubuntu-latest
    # Informational: a failure here must not stop the pull request.
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.sync.outputs.master }}
          persist-credentials: false

      - name: Resolve
        env:
          UPSTREAM: ${{ needs.sync.outputs.upstream }}
        run: |
          rc=0
          scripts/sync-upstream.sh "$UPSTREAM" || rc=$?
          [ "$rc" = 0 ] || [ "$rc" = 11 ] || exit "$rc"
          # Without a root conanfile.py there is no graph to resolve here.
          [ -f conanfile.py ] || exit 0
          pipx install "conan==$CONAN_VERSION"
          export CONAN_HOME="$RUNNER_TEMP/conan-home"
          conan config install .config/global.conf
          conan remote remove conancenter
          conan remote add local . --type=local-recipes-index
          # Table rows only; the pull-request job adds the heading.
          {
            for profile in .github/profiles/*.conanprofile; do
              # The build profile is the one the desktop builds use, so that tool_requires
              # gated on settings_build (msys2, nasm, ...) are resolved for each OS: the
              # host profile itself, except that Intel macOS is cross-built on Apple
              # silicon. graph info builds nothing, so any runner can do this.
              build="$profile"
              case "$profile" in
                */macos-latest-x86_64.conanprofile) build=.github/profiles/macos-latest-armv8.conanprofile ;;
              esac
              if conan graph info . -pr:h "$profile" -pr:b "$build" \
                  -s build_type=Release --format=json > "$RUNNER_TEMP/graph.json" 2> "$RUNNER_TEMP/graph.err"; then
                result="resolved, $(jq '.graph.nodes | length - 1' "$RUNNER_TEMP/graph.json") dependencies"
              else
                # Within what the pull-request job accepts: no pipe, backtick or
                # backslash (Windows paths), at most 300 characters.
                error="$(grep -m1 '^ERROR' "$RUNNER_TEMP/graph.err" | tr '|`\\' "/'/" | cut -c1-300 || true)"
                if [ -n "$error" ]; then result="**failed:** \`$error\`"; else result="**failed:** see the job log"; fi
                cat "$RUNNER_TEMP/graph.err" >&2
              fi
              echo "| \`$(basename "$profile" .conanprofile)\` | $result |"
            done
          } > "$RUNNER_TEMP/graph.md"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: graph-report
          path: ${{ runner.temp }}/graph.md
          retention-days: 7
          overwrite: true

  pull-request:
    name: Open or update the pull request
    needs: [sync, graph]
    if: ${{ !cancelled() && needs.sync.result == 'success' && needs.sync.outputs.result == 'changed' }}
    runs-on: ubuntu-latest
    # Holds the app's secrets; restrict its deployment branches to master.
    environment: sync-upstream
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.sync.outputs.master }}
          persist-credentials: false

      - name: Sync
        id: sync
        env:
          UPSTREAM: ${{ needs.sync.outputs.upstream }}
        run: |
          rc=0
          scripts/sync-upstream.sh --report "$RUNNER_TEMP/report.md" "$UPSTREAM" || rc=$?
          case "$rc" in
            0) echo "result=clean" >> "$GITHUB_OUTPUT" ;;
            11) echo "result=attention" >> "$GITHUB_OUTPUT" ;;
            *) exit "$rc" ;;
          esac

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: graph-report
          path: ${{ runner.temp }}/graph

      - name: Write the pull request body
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            head -c 50000 "$RUNNER_TEMP/report.md"
            printf '\n## Dependency graph\n\n'
            if [ ! -f conanfile.py ]; then
              echo "Not resolved: there is no root \`conanfile.py\` to resolve."
            elif [ ! -f "$RUNNER_TEMP/graph/graph.md" ]; then
              echo "Not resolved: the graph job failed, see the run."
            else
              echo "\`conan graph info\` per profile with Conan $CONAN_VERSION, against this tree only. Nothing was built."
              echo
              echo "| Profile | Result |"
              echo "| --- | --- |"
              # The graph job ran upstream code, so only rows of the exact expected shape
              # are taken from its report; errors stay inside a code span. Printable ASCII
              # only, so no control byte or lookalike character can reach the body.
              # shellcheck disable=SC2016 # the backticks are literal
              row='^\| `[A-Za-z0-9_.-]+` \| (resolved, [0-9]+ dependencies|\*\*failed:\*\* see the job log|\*\*failed:\*\* `[^`|\\]{1,300}`) \|$'
              rows="$(LC_ALL=C tr -cd '\n -~' < "$RUNNER_TEMP/graph/graph.md")"
              # One row per profile of this checkout, so a row that is missing or does not
              # match still shows up as a failure instead of disappearing.
              for profile in .github/profiles/*.conanprofile; do
                name="$(basename "$profile" .conanprofile)"
                line="$(printf '%s\n' "$rows" | awk -v p="| \`$name\` | " 'index($0, p) == 1 { print; exit }')"
                if [ -z "$line" ]; then
                  echo "| \`$name\` | **not reported:** see the job log |"
                elif printf '%s\n' "$line" | LC_ALL=C grep -qE "$row"; then
                  echo "$line"
                else
                  echo "| \`$name\` | **failed:** see the job log |"
                fi
              done
            fi
            echo
            echo "---"
            echo "Opened by the [Sync upstream]($RUN_URL) workflow, which replaces this branch every week while"
            echo "the pull request is open. A commit by anyone else stops that until it is merged, or the branch is deleted."
          } > "$RUNNER_TEMP/body.md"
          cat "$RUNNER_TEMP/body.md" >> "$GITHUB_STEP_SUMMARY"

      # An app token rather than GITHUB_TOKEN: a pull request pushed with
      # GITHUB_TOKEN does not trigger workflows, so the required checks would
      # never run on it.
      - name: Create app token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Check the branch
        id: check
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          LEASE: ${{ needs.sync.outputs.lease }}
          MASTER: ${{ needs.sync.outputs.master }}
          SYNC_APP_SLUG: ${{ vars.SYNC_APP_SLUG }}
        run: |
          # The sync job told the app's commits from others' by this name.
          [ "$APP_SLUG" = "$SYNC_APP_SLUG" ] \
            || { echo "::error::SYNC_APP_SLUG is $SYNC_APP_SLUG, but the app is $APP_SLUG"; exit 1; }
          # The action below force-pushes without a lease, and puts the sync onto
          # master as it is then, so make sure neither has moved since the sync job.
          head="$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)"
          [ "$head" = "$LEASE" ] \
            || { echo "::error::$BRANCH moved since the check (${LEASE:-none} -> ${head:-none}); run again"; exit 1; }
          [ "$(git ls-remote origin refs/heads/master | cut -f1)" = "$MASTER" ] \
            || { echo "::error::master moved since the sync job; run again"; exit 1; }
          bot="${APP_SLUG}[bot]"
          # The noreply address links the commit to the app; a wrong one would make
          # the next run take the app's own commit for someone else's.
          id="$(gh api "/users/$bot" --jq .id)"
          case "$id" in '' | *[!0-9]*) echo "::error::no user id for $bot"; exit 1 ;; esac
          echo "identity=$bot <$id+$bot@users.noreply.github.com>" >> "$GITHUB_OUTPUT"

      # The organisation's way to open bot pull requests (see owncloud/reusable-workflows).
      # It commits the whole worktree as the app, puts that commit onto master and
      # pushes it with git. Not sign-commits: that recreates the commit file by file
      # through the API, and a sync touches more files than GitHub's secondary rate
      # limit allows per hour. The branch has no signature rule, and the squash merge
      # onto master is signed by GitHub.
      - name: Open or update the pull request
        id: cpr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app.outputs.token }}
          branch: ${{ env.BRANCH }}
          base: master
          title: ${{ env.TITLE }}
          body-path: ${{ runner.temp }}/body.md
          commit-message: |
            ${{ env.TITLE }}

            Upstream: conan-io/conan-center-index@${{ needs.sync.outputs.upstream }}
          author: ${{ steps.check.outputs.identity }}
          committer: ${{ steps.check.outputs.identity }}
          signoff: true
          delete-branch: true
          # Applies on create only; the next step sets it on every later run.
          draft: ${{ steps.sync.outputs.result != 'clean' }}

      - name: Set the draft state
        # Also when the branch was already up to date (operation none), since the
        # draft state may still be wrong, e.g. after a manual change.
        if: steps.cpr.outputs.pull-request-number != '' && !contains(fromJSON('["created", "closed"]'), steps.cpr.outputs.pull-request-operation)
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PR: ${{ steps.cpr.outputs.pull-request-number }}
          RESULT: ${{ steps.sync.outputs.result }}
        run: |
          is_draft="$(gh pr view "$PR" --json isDraft --jq .isDraft)"
          if [ "$RESULT" = clean ] && [ "$is_draft" = true ]; then
            gh pr ready "$PR"
          elif [ "$RESULT" != clean ] && [ "$is_draft" = false ]; then
            gh pr ready "$PR" --undo
          fi
